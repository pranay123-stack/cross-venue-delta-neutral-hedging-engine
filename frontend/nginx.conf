# Serves the dashboard and proxies the API and WebSocket to the backend, so
# the browser only ever talks to one origin and CORS never applies.

upstream hedgelab_backend {
    server backend:8000;
}

server {
    listen 80;
    # Also bind IPv6: inside the container `localhost` resolves to ::1 first,
    # so an IPv4-only listener makes every health check fail.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is a single-page app: unknown paths are routes, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://hedgelab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://hedgelab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A live feed must not be closed for being idle between price ticks.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /docs        { proxy_pass http://hedgelab_backend/docs; }
    location = /openapi.json { proxy_pass http://hedgelab_backend/openapi.json; }
}
