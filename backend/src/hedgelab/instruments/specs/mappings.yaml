# Hedge pairs: a Delta Exchange perpetual hedged with the Hyperliquid
# perpetual on the same underlying.  GENERATED by `hedgelab instruments sync`;
# adding a pair is a configuration change.
#
# The two venues size the same exposure differently -- Delta in contracts of
# 0.001 BTC / 0.01 ETH / 1 SOL / 0.001 PAXG, Hyperliquid in coins -- and fund
# on different clocks: Delta every 8h (4h for PAXG), Hyperliquid every hour.

mappings:
- name: BTC Delta perp -> Hyperliquid perp
  source: PAPER_DELTA:BTCUSD
  hedge: PAPER_HYPERLIQUID:BTC
  objective: QUOTE_PNL_NEUTRAL
  target_ratio: '1.0'
  tolerance_bps: '25'
  max_notional: '2000000'
  enabled: true
- name: ETH Delta perp -> Hyperliquid perp
  source: PAPER_DELTA:ETHUSD
  hedge: PAPER_HYPERLIQUID:ETH
  objective: BASE_ASSET_NEUTRAL
  target_ratio: '1.0'
  tolerance_bps: '30'
  max_notional: '1000000'
  enabled: true
- name: SOL Delta perp -> Hyperliquid perp
  source: PAPER_DELTA:SOLUSD
  hedge: PAPER_HYPERLIQUID:SOL
  objective: BASE_ASSET_NEUTRAL
  target_ratio: '1.0'
  tolerance_bps: '50'
  max_notional: '400000'
  enabled: true
- name: PAXG Delta perp -> Hyperliquid perp
  source: PAPER_DELTA:PAXGUSD
  hedge: PAPER_HYPERLIQUID:PAXG
  objective: NOTIONAL_NEUTRAL
  target_ratio: '1.0'
  tolerance_bps: '40'
  max_notional: '300000'
  enabled: true
