name: Bug report
description: Something produced a wrong number, crashed, or behaved unsafely.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, API calls or dashboard steps. Replay mode (`make demo`) reproduces deterministically.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Market data source
      options: [replay (recorded session), live public data, not sure]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker or local, commit hash.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove anything private before pasting.
      render: shell
