name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-lock.txt -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy (strict)
        run: mypy src
      - name: Tests (offline; network access fails the suite)
        run: python -m pytest tests -q -p no:cacheprovider

  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, Chrome)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -c requirements-lock.txt -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Playwright (system Chrome, replay data)
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisories land upstream at any time; report them without blocking
    # unrelated changes.  Read the log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (pinned backend set)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
